[project]
name = "pyside6-mvvm-framework"
version = "1.0.0"
description = "A general-purpose MVVM framework for PySide6 based on Qt property system"
readme = "mvvm_framework/README.md"
license = {text = "MIT"}
authors = [
    {name = "MVVM Framework Authors"}
]
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/pyside6-mvvm-framework"
Documentation = "https://github.com/example/pyside6-mvvm-framework#readme"
Repository = "https://github.com/example/pyside6-mvvm-framework.git"
Issues = "https://github.com/example/pyside6-mvvm-framework/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvvm_framework"]

[tool.hatch.build.targets.sdist]
include = [
    "/mvvm_framework",
    "/README.md",
    "/mvvm_framework/README.md",
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.ruff.isort]
known-first-party = ["mvvm_framework"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mvvm_framework --cov-report=term-missing"
