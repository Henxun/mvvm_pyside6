readme = "README.md"
authors = [
    { name = "henxun", email = "1371490145@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
