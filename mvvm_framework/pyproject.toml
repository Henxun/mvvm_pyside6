[project]
name = "mvvm-framework"
version = "1.0.0"
description = "A general-purpose MVVM framework based on PySide6 property system"
readme = "README.md"
authors = [
    { name = "qwen.ai[bot]", email = "qwenlm-intl@service.alibaba.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
